# Third-party actions in .github/workflows are pinned to commit SHAs, which is the safe
# form but never moves on its own. This file is what keeps them current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(actions)
    open-pull-requests-limit: 5
