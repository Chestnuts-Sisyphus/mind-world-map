name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs, not movable tags: a tag name can be
      # retargeted upstream, and this job holds a write token. Comments record which release
      # each SHA corresponds to, which is what Dependabot updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Full history + tags: the main-HEAD comparison and the version/tag alignment
          # check both need refs that a shallow single-tag checkout does not carry.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Only the head of main may be released. Without this, tagging any historical commit
      # pushes a GitHub release built from code that never passed the branch gates, and
      # "main == newest tag" stays a human promise.
      - name: Tag must point at main HEAD
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "$TAG")"
          main_head="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_head" ]; then
            echo "::error::refuse to release $TAG: tag points at $tag_commit while main is at $main_head"
            exit 1
          fi
          echo "tag $TAG verified as the head of main ($main_head)"

      # A tag that skips the gates would publish an unsafe surface: re-check here.
      - name: Publication gates
        run: |
          python tools/preflight.py
          python tools/preflight.py --self-test

      # The changelog section is the only source of both the body and the title. No section
      # or no descriptive subject means failure -- this job must never invent a bare-version
      # title, which is how v1.0.4..v1.0.7 ended up labelled with six characters.
      - name: Extract release notes and title
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python tools/release_notes.py "$TAG" --check
          python tools/release_notes.py "$TAG" > release-notes.md
          python tools/release_notes.py "$TAG" --title > release-title.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG"
          --title "$(cat release-title.txt)"
          --notes-file release-notes.md
          --verify-tag
